<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>한 줄 방명록</title><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f3f7fa;color:#193144;margin:0;line-height:1.6}header{background:#122b40;color:white;padding:24px}main{max-width:720px;margin:auto;padding:22px}.card{background:white;padding:20px;border:1px solid #d3e1e9;border-radius:12px;margin-bottom:18px}a{color:#1079b8}header a{color:white}label{display:block;margin-top:12px;font-weight:bold}input,textarea{width:100%;padding:12px;border:1px solid #9aafb9;border-radius:8px;font:inherit}button{background:#075b93;color:white;padding:12px 20px;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.6}ul{padding:0;list-style:none}li{border-top:1px solid #d3e1e9;padding:14px 0}li p{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#667}.error{color:#a12b19}
</style></head><body><header><div style="max-width:680px;margin:auto"><h1>한 줄 방명록</h1><a href="/">← 날씨·공휴일 조회</a></div></header><main>
<section class="card"><h2>방문 기록 남기기</h2><p>별명을 사용하세요. 실명, 전화번호, 학번은 입력하지 마세요.</p><form id="form"><label for="name">별명 (1~20자)</label><input id="name" maxlength="20" required><label for="message">내용 (1~200자)</label><textarea id="message" rows="3" maxlength="200" required></textarea><p><button id="send">등록하기</button></p></form><p id="status" role="status" aria-live="polite"></p></section>
<section class="card"><h2>최근 20개</h2><p id="list-state" aria-live="polite">불러오는 중…</p><ul id="list"></ul><button id="reload" type="button">새로고침</button></section>
</main><script>
const form=document.getElementById('form'),status=document.getElementById('status'),list=document.getElementById('list'),state=document.getElementById('list-state'),send=document.getElementById('send');
function el(tag,text){const e=document.createElement(tag);e.textContent=String(text??'');return e;}
async function load(){state.textContent='불러오는 중…';state.className='';list.replaceChildren();try{const r=await fetch('/api/guestbook',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'조회 실패');const items=Array.isArray(d.items)?d.items:[];state.textContent=items.length?'':'아직 글이 없습니다.';for(const item of items){const li=el('li',''),date=el('small',new Date(item.created_at).toLocaleString('ko-KR'));li.append(el('strong',item.name),el('p',item.message),date);list.append(li);}}catch(e){state.className='error';state.textContent=e.message||'연결 오류';}}
form.addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),message=document.getElementById('message').value.trim();if(!name||name.length>20||!message||message.length>200){status.textContent='이름 및 내용 글자 수를 확인하세요.';return;}send.disabled=true;status.textContent='저장 중…';status.className='';try{const r=await fetch('/api/guestbook',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,message})}),d=await r.json();if(!r.ok)throw Error(d.error||'저장 실패');status.textContent='저장했습니다.';form.reset();await load();}catch(e){status.className='error';status.textContent=e.message||'연결 오류';}finally{send.disabled=false;}});
document.getElementById('reload').addEventListener('click',load);load();
</script></body></html>
