<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>유학생을 위한 날씨와 공휴일 조회</title>
  <meta name="description" content="유학생이 도시 날씨와 한국 공휴일을 함께 확인하는 Vercel Serverless 프로젝트입니다.">
  <style>
    :root {
      --ink: #172033; --muted: #526173; --line: #d6dee7; --bg: #f4f7fa; --card: #ffffff;
      --brand: #005596; --teal: #0f766e; --warn-bg: #fff7ed; --warn-line: #fdba74; --warn-ink: #9a3412;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6; word-break: keep-all;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    header { background: #122b40; color: #fff; padding: 28px 20px 24px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { margin: 0; font-size: clamp(25px, 5vw, 32px); line-height: 1.3; }
    header p { margin: 8px 0 0; color: #d7e3ec; }
    main { padding: 24px 20px 40px; }
    form {
      display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
    }
    .weather-form { grid-template-columns: 1fr auto; margin-bottom: 18px; }
    input { width: 100%; height: 48px; border: 1px solid #9fb3c4; background: #fff; color: var(--ink); padding: 0 12px; border-radius: 10px; font: inherit; }
    .weather-result { margin-top: 12px; }
    .weather-data { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 0; }
    .weather-data div { background: #eff6ff; border-radius: 10px; padding: 10px; }
    .weather-data strong, .weather-data span { display: block; }
    .weather-data span { color: var(--muted); font-size: 13px; }
    label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    select, button { width: 100%; height: 48px; font: inherit; border-radius: 10px; }
    select { border: 1px solid #9fb3c4; background: #fff; color: var(--ink); padding: 0 12px; }
    button { border: 0; background: var(--brand); color: #fff; font-weight: 700; padding: 0 24px; cursor: pointer; }
    button:disabled { background: #6f8ca6; cursor: progress; }
    :focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    #result { margin-top: 18px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    .panel h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.4; }
    .panel h2, .panel p { overflow-wrap: anywhere; }
    .list { list-style: none; margin: 8px 0 0; padding: 0; }
    .list li { display: flex; gap: 14px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--line); }
    .date { min-width: 120px; font-weight: 700; color: var(--brand); }
    .name { flex: 1; overflow-wrap: anywhere; }
    .badge { font-size: 13px; font-weight: 700; color: var(--teal); background: #e6f4f1; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
    .meta { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
    .meta a { color: #0b6a8a; }
    .loading { display: flex; align-items: center; gap: 12px; color: var(--muted); }
    .spinner { flex: none; width: 24px; height: 24px; border: 3px solid #cfe0ee; border-top-color: var(--brand); border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    .empty p { margin: 4px 0; color: var(--muted); }
    .error { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
    .error p { margin: 6px 0; }
    .error .hint { color: #7c2d12; font-size: 15px; }
    .error .code { font-size: 13px; color: #9a3412; }
    .retry { width: auto; height: 42px; margin-top: 8px; background: #9a3412; }
    footer { padding: 0 20px 32px; font-size: 13px; color: var(--muted); }
    @media (max-width: 560px) {
      form { grid-template-columns: 1fr 1fr; }
      form button { grid-column: 1 / -1; }
      .weather-form { grid-template-columns: 1fr; }
      .weather-form button { grid-column: auto; }
      .weather-data { grid-template-columns: 1fr 1fr; }
      .list li { flex-wrap: wrap; gap: 2px 12px; }
      .date { min-width: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>유학생을 위한 날씨와 공휴일 조회</h1>
      <p>도시의 현재 날씨를 확인하고, 한국 공휴일을 함께 계획하세요.</p>
    </div>
  </header>
  <main class="wrap">
    <section class="panel" aria-labelledby="weather-title">
      <h2 id="weather-title">도시 날씨</h2>
      <p class="meta">기존 Weather for Students 기능을 Vercel Serverless API로 연결했습니다.</p>
      <form id="weather-search" class="weather-form">
        <div><label for="city">도시 이름</label><input id="city" name="city" placeholder="예: Seoul, Busan, 수원" autocomplete="address-level2"></div>
        <button id="weather-submit" type="submit">날씨 조회</button>
      </form>
      <section id="weather-result" class="weather-result" aria-live="polite"></section>
    </section>
    <div style="height:18px" aria-hidden="true"></div>
    <section aria-labelledby="holiday-title">
      <h2 id="holiday-title">월별 한국 공휴일</h2>
    <form id="search">
      <div><label for="year">연도</label><select id="year" name="year"></select></div>
      <div><label for="month">월</label><select id="month" name="month"></select></div>
      <button id="submit" type="submit">조회</button>
    </form>
    <section id="result" aria-live="polite" aria-busy="false"></section>
    </section>
  </main>
  <footer class="wrap">날씨: Open-Meteo · 공휴일: 한국천문연구원 특일 정보(공공데이터포털)</footer>

  <script>
    const weatherForm = document.getElementById('weather-search');
    const cityInput = document.getElementById('city');
    const weatherButton = document.getElementById('weather-submit');
    const weatherResult = document.getElementById('weather-result');
    const form = document.getElementById('search');
    const yearSelect = document.getElementById('year');
    const monthSelect = document.getElementById('month');
    const submitButton = document.getElementById('submit');
    const result = document.getElementById('result');
    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

    // 한국 시간 기준으로 오늘의 연·월을 구하고 선택 목록을 채웁니다
    const now = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Seoul', year: 'numeric', month: 'numeric' })
      .formatToParts(new Date()).map((part) => [part.type, part.value]));
    const thisYear = Number(now.year);
    const thisMonth = Number(now.month);
    for (let y = thisYear - 1; y <= thisYear + 1; y++) yearSelect.add(new Option(`${y}년`, String(y)));
    for (let m = 1; m <= 12; m++) monthSelect.add(new Option(`${m}월`, String(m)));

    // 작은 도우미: 태그를 만들고 글자는 textContent로 넣습니다(받은 글자를 HTML로 해석하지 않음)
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function showWeather(message, error = false) {
      const panel = el('div', `panel${error ? ' error' : ''}`, message);
      weatherResult.replaceChildren(panel);
    }
    async function searchWeather(city) {
      const value = city.trim();
      if (value.length < 2) return showWeather('도시 이름을 두 글자 이상 입력하세요.', true);
      weatherButton.disabled = true;
      showWeather('날씨 정보를 불러오는 중입니다…');
      try {
        const response = await fetch(`/api/weather?city=${encodeURIComponent(value)}`);
        const data = await response.json().catch(() => null);
        if (!response.ok || !data) return showWeather(data?.error || `서버가 ${response.status} 오류로 답했습니다.`, true);
        const panel = el('div', 'panel');
        panel.append(el('h2', '', data.city), el('p', '', `${data.temperature}°C · ${data.weather} · 체감 ${data.apparentTemperature}°C`));
        const grid = el('div', 'weather-data');
        for (const [label, value] of [['강수확률', data.precipitationProbability === null ? '-' : `${data.precipitationProbability}%`], ['풍속', `${data.windSpeed} km/h`], ['조회 시각', formatTime(data.fetchedAt)]]) {
          const item = el('div'); item.append(el('span', '', label), el('strong', '', value)); grid.append(item);
        }
        panel.append(grid, el('p', 'meta', `출처: ${data.source} · 10분 CDN 캐시`));
        weatherResult.replaceChildren(panel);
      } catch {
        showWeather('서버에 연결하지 못했습니다. 잠시 뒤 다시 시도하세요.', true);
      } finally {
        weatherButton.disabled = false;
      }
    }
    weatherForm.addEventListener('submit', (event) => { event.preventDefault(); searchWeather(cityInput.value); });
    function isValid(year, month) {
      return /^\d{4}$/.test(year) && /^\d{1,2}$/.test(month) && Number(month) >= 1 && Number(month) <= 12;
    }
    function label(year, month) {
      return isValid(year, month) ? `${year}년 ${Number(month)}월` : '선택한 조건의';
    }
    function formatDate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return `${m}월 ${d}일 (${WEEKDAYS[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]})`;
    }
    function formatTime(iso) {
      return new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false })
        .format(new Date(iso));
    }
    function setBusy(busy) {
      result.setAttribute('aria-busy', String(busy));
      submitButton.disabled = busy;
    }
    function meta(data, apiUrl) {
      const p = el('p', 'meta', `가져온 시각 ${formatTime(data.fetchedAt)} · `);
      const link = el('a', '', '이 조건의 API 응답 보기');
      link.href = apiUrl;
      link.target = '_blank';
      link.rel = 'noopener';
      p.append(link);
      return p;
    }

    // 네 가지 화면 상태: 불러오는 중 · 결과 있음 · 결과 없음 · 오류
    function showLoading(year, month) {
      const panel = el('div', 'panel loading');
      panel.append(el('span', 'spinner'), el('span', '', `${label(year, month)} 공휴일을 불러오는 중입니다…`));
      result.replaceChildren(panel);
    }
    function showList(data, apiUrl) {
      const panel = el('div', 'panel');
      panel.append(el('h2', '', `${data.year}년 ${data.month}월 공휴일 ${data.count}일`));
      const list = el('ul', 'list');
      for (const item of data.items) {
        const li = el('li');
        li.append(el('span', 'date', formatDate(item.date)), el('span', 'name', item.name));
        if (item.holiday) li.append(el('span', 'badge', '쉬는 날'));
        list.append(li);
      }
      panel.append(list, meta(data, apiUrl));
      result.replaceChildren(panel);
    }
    function showEmpty(data, apiUrl) {
      const panel = el('div', 'panel empty');
      panel.append(el('h2', '', `${data.year}년 ${data.month}월에는 공휴일이 없습니다`),
        el('p', '', '다른 달을 골라 조회해 보세요.'), meta(data, apiUrl));
      result.replaceChildren(panel);
    }
    function showError(message, hint, status, year, month) {
      const panel = el('div', 'panel error');
      panel.setAttribute('role', 'alert');
      panel.append(el('h2', '', '공휴일 정보를 불러오지 못했습니다'), el('p', '', message));
      if (hint) panel.append(el('p', 'hint', `확인할 점: ${hint}`));
      if (status) panel.append(el('p', 'code', `응답 코드 ${status}`));
      const retry = el('button', 'retry', '다시 시도');
      retry.type = 'button';
      retry.addEventListener('click', () => search(year, month));
      panel.append(retry);
      result.replaceChildren(panel);
    }

    let controller = null;
    async function search(year, month) {
      controller?.abort(); // 앞의 조회가 끝나기 전에 새로 조회하면 앞의 요청은 멈춥니다
      controller = new AbortController();
      const { signal } = controller;
      setBusy(true);
      showLoading(year, month);
      const query = `?year=${encodeURIComponent(year)}&month=${encodeURIComponent(month)}`;
      try { history.replaceState(null, '', query); } catch {} // 조건이 담긴 주소를 그대로 공유할 수 있습니다
      const apiUrl = `/api/holidays${query}`;
      try {
        const response = await fetch(apiUrl, { signal });
        const data = await response.json().catch(() => null);
        if (!response.ok || !data) {
          showError(data?.error || `서버가 ${response.status} 오류로 답했습니다.`, data?.hint, response.status, year, month);
        } else if (data.count === 0) {
          showEmpty(data, apiUrl);
        } else {
          showList(data, apiUrl);
        }
      } catch (error) {
        if (error.name === 'AbortError') return;
        if (location.protocol === 'file:') {
          showError('이 화면은 함수와 함께 열어야 조회됩니다.',
            '예제 폴더에서 node scripts/dev.mjs --mock 을 실행하고 http://localhost:3000 으로 엽니다. 배포한 뒤에는 운영 주소로 엽니다.', 0, year, month);
        } else {
          showError('서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요.', '', 0, year, month);
        }
      } finally {
        if (!signal.aborted) setBusy(false);
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      search(yearSelect.value, monthSelect.value);
    });

    // 처음 열 때: 주소에 ?year=&month=가 있으면 그 조건으로, 없으면 이번 달로 조회합니다
    const start = new URLSearchParams(location.search);
    const startYear = start.get('year') ?? String(thisYear);
    const startMonth = start.get('month') ?? String(thisMonth);
    if ([...yearSelect.options].some((o) => o.value === startYear)) yearSelect.value = startYear;
    if ([...monthSelect.options].some((o) => o.value === String(Number(startMonth)))) monthSelect.value = String(Number(startMonth));
    search(startYear, startMonth);
  </script>
</body>
</html>
